name: AI-Vector-Shield Full Mathematical & Red-Team Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  redteam-and-casimir-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy scipy matplotlib --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run 5-Test Production White-Box PGD & Casimir Red-Team Suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run Production Phase 5 Benchmark & Clean-Token Distortion Audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python topological_poison_shield.py