[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-vector-shield"
version = "0.1.0"
description = "Enterprise Vector Firewall for RAG pipelines powered by piecewise-local complex projective manifolds."
readme = "README.md"
authors = [{ name = "Ivan", email = "ivan@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["torch>=2.0.0", "numpy>=1.20.0", "scikit-learn>=1.0.0", "scipy>=1.7.0"]